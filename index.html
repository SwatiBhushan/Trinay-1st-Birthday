<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trinay's 1st Birthday Celebration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Nunito:wght@400;600;700&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0e1a;
            --navy-deep: #121829;
            --pastel-purple: #d8b4fe;
            --pastel-blue: #93c5fd;
            --pastel-pink: #f472b6;
            --gold-accent: #fef08a;
            --text-light: #f8fafc;
            --card-bg: rgba(18, 24, 41, 0.75);
            --border-glow: rgba(192, 132, 252, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Nunito', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 16px 60px 16px;
            position: relative;
            z-index: 10;
        }

        .top-nav {
            display: flex;
            justify-content: flex-end;
            padding: 10px 0;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-glow);
            color: var(--text-light);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .icon-btn:hover {
            background: rgba(192, 132, 252, 0.25);
            transform: scale(1.05);
        }

        .icon-btn.playing {
            background: rgba(192, 132, 252, 0.4);
            border-color: var(--gold-accent);
            box-shadow: 0 0 12px rgba(252, 211, 77, 0.6);
            animation: pulse-audio 1s infinite alternate ease-in-out;
        }

        @keyframes pulse-audio {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .hero-section {
            text-align: center;
            margin: 20px 0 35px 0;
        }

        /* Full Moon & Badge Container */
        .moon-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 25px auto;
        }

        .full-moon {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fffdf0 0%, #fae8a4 50%, #e2c068 85%, #b89235 100%);
            box-shadow: 0 0 30px rgba(252, 211, 77, 0.6), 0 0 60px rgba(192, 132, 252, 0.3);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Moon Crater Details */
        .moon-crater {
            position: absolute;
            background: rgba(184, 146, 53, 0.2);
            border-radius: 50%;
        }

        .crater-1 { width: 35px; height: 35px; top: 20%; left: 20%; }
        .crater-2 { width: 25px; height: 25px; bottom: 25%; left: 30%; }
        .crater-3 { width: 45px; height: 45px; top: 40%; right: 15%; }

        .moon-number {
            font-family: 'Cinzel', serif;
            font-size: 5rem;
            font-weight: 800;
            color: #121829;
            text-shadow: 0px 2px 4px rgba(255, 255, 255, 0.4);
            z-index: 2;
            line-height: 1;
        }

        .side-star {
            position: absolute;
            top: -5px;
            right: -10px;
            font-size: 2.8rem;
            color: var(--gold-accent);
            filter: drop-shadow(0 0 10px rgba(252, 211, 77, 0.8));
            animation: pulse-star 2s infinite alternate ease-in-out;
            z-index: 3;
        }

        @keyframes pulse-star {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.15) rotate(12deg); }
        }

        /* Invited Header Styling matched to reference image */
        .invite-prefix {
            font-family: 'Sacramento', cursive;
            font-size: 2.5rem;
            color: var(--pastel-purple);
            line-height: 1.1;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        h1.title {
            font-family: 'Cinzel', serif;
            font-size: 2.1rem;
            font-weight: 800;
            color: var(--gold-accent);
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(254, 240, 138, 0.3);
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--pastel-blue);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 25px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .info-icon {
            font-size: 1.5rem;
            background: rgba(192, 132, 252, 0.15);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .info-text label {
            display: block;
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-text span {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-light);
        }

        /* Countdown Timer */
        .countdown-title {
            text-align: center;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--pastel-purple);
            margin-bottom: 12px;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            text-align: center;
        }

        .timer-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 5px;
        }

        .timer-num {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--gold-accent);
        }

        .timer-unit {
            font-size: 0.65rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--pastel-blue);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s ease;
        }

        .form-input:focus {
            border-color: var(--pastel-purple);
            box-shadow: 0 0 10px rgba(192, 132, 252, 0.3);
        }

        /* Equal-Height Radio Buttons Fix for Mobile */
        .radio-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            align-items: stretch;
        }

        .radio-btn {
            position: relative;
            height: 100%;
        }

        .radio-btn input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .radio-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 8px;
            height: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            text-align: center;
            transition: all 0.3s ease;
        }

        .radio-subtext {
            font-size: 0.75rem;
            font-weight: 400;
            opacity: 0.8;
            margin-top: 2px;
        }

        .radio-btn input:checked + .radio-label {
            background: rgba(192, 132, 252, 0.25);
            border-color: var(--pastel-purple);
            color: #fff;
            box-shadow: 0 0 12px rgba(192, 132, 252, 0.4);
        }

        /* Pax Selector */
        .pax-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 6px;
            transition: opacity 0.3s ease;
        }

        .pax-control.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .pax-btn {
            width: 40px;
            height: 40px;
            background: rgba(192, 132, 252, 0.2);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .pax-btn:hover {
            background: rgba(192, 132, 252, 0.4);
        }

        .pax-count {
            font-size: 1.2rem;
            font-weight: 700;
            width: 60px;
            text-align: center;
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--pastel-purple), #8b5cf6);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2deg);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
        }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Status Toast */
        .status-msg {
            display: none;
            padding: 12px;
            border-radius: 10px;
            margin-top: 12px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .status-msg.success {
            display: block;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.5);
            color: #4ade80;
        }

        .status-msg.error {
            display: block;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #f87171;
        }

        /* Photo Upload Section */
        .photo-preview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 15px;
        }

        .photo-thumb {
            width: 100%;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--border-glow);
        }

        /* Host Config Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--navy-deep);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 450px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="container">
        
        <!-- Top Navigation Icons -->
        <div class="top-nav">
            <button class="icon-btn" id="audio-toggle" title="Play Twinkle Twinkle Melody">🎵</button>
            <button class="icon-btn" id="settings-toggle" title="Host Configuration" style="margin-left: 10px;">⚙️</button>
        </div>

        <!-- Hero Banner -->
        <div class="hero-section">
            <div class="moon-container">
                <div class="full-moon">
                    <div class="moon-crater crater-1"></div>
                    <div class="moon-crater crater-2"></div>
                    <div class="moon-crater crater-3"></div>
                    <div class="moon-number">1</div>
                </div>
                <div class="side-star">⭐</div>
            </div>
            
            <p class="invite-prefix">You're invited to celebrate</p>
            <h1 class="title">TRINAY'S 1ST BIRTHDAY</h1>
            <p class="subtitle">Little Star is Turning One</p>
        </div>

        <!-- Date & Location Details -->
        <div class="card">
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-icon">📅</div>
                    <div class="info-text">
                        <label>Date</label>
                        <span>Sunday, 11 Oct</span>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-icon">🕕</div>
                    <div class="info-text">
                        <label>Time</label>
                        <span>6:00 PM Onwards</span>
                    </div>
                </div>
            </div>

            <div class="info-item" style="margin-bottom: 20px;">
                <div class="info-icon">📍</div>
                <div class="info-text">
                    <label>Venue</label>
                    <span>Eden Park, Cunningham Road</span>
                </div>
            </div>

            <!-- Google Maps Link -->
            <a href="https://maps.google.com/?q=Eden+Park+Cunningham+Road" target="_blank" class="btn-secondary">
                🗺️ Open in Google Maps
            </a>
        </div>

        <!-- Countdown Timer -->
        <div class="card">
            <div class="countdown-title">Countdown to Celebration</div>
            <div class="timer-grid">
                <div class="timer-box">
                    <div class="timer-num" id="days">00</div>
                    <div class="timer-unit">Days</div>
                </div>
                <div class="timer-box">
                    <div class="timer-num" id="hours">00</div>
                    <div class="timer-unit">Hours</div>
                </div>
                <div class="timer-box">
                    <div class="timer-num" id="minutes">00</div>
                    <div class="timer-unit">Mins</div>
                </div>
                <div class="timer-box">
                    <div class="timer-num" id="seconds">00</div>
                    <div class="timer-unit">Secs</div>
                </div>
            </div>
        </div>

        <!-- RSVP Form -->
        <div class="card">
            <h2 style="font-family: 'Cinzel', serif; margin-bottom: 18px; font-size: 1.4rem; text-align: center; color: var(--pastel-purple);">
                RSVP Response
            </h2>
            <form id="rsvp-form">
                
                <div class="form-group">
                    <label for="guest-name">Guest Name</label>
                    <input type="text" id="guest-name" class="form-input" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label>Will you be attending?</label>
                    <div class="radio-group">
                        <div class="radio-btn">
                            <input type="radio" id="rsvp-yes" name="attending" value="Yes" checked>
                            <label for="rsvp-yes" class="radio
