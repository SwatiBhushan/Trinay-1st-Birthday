<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trinay's 1st Birthday Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070B19;
            --navy-card: #0D152D;
            --pastel-purple: #C084FC;
            --pastel-blue: #93C5FD;
            --gold-glow: #FDE047;
            --white: #F8FAFC;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
        }

        #star-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(13, 21, 45, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(192, 132, 252, 0.2);
            border-radius: 24px;
            padding: 2rem 1.5rem;
            z-index: 1;
            box-shadow: 0 0 30px rgba(192, 132, 252, 0.15);
            text-align: center;
            position: relative;
        }

        .moon-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 1.5rem auto;
        }

        .full-moon {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 35% 35%, #FFFDF0 0%, #FDF4C7 45%, #E2C974 80%, #CBB053 100%);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(253, 224, 71, 0.5), inset -10px -10px 20px rgba(180, 140, 30, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Moon Crater Details */
        .crater {
            position: absolute;
            background: rgba(180, 140, 30, 0.15);
            border-radius: 50%;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.15);
        }
        .crater-1 { width: 30px; height: 30px; top: 20%; left: 20%; }
        .crater-2 { width: 20px; height: 20px; bottom: 25%; left: 30%; }
        .crater-3 { width: 40px; height: 40px; top: 50%; right: 15%; }

        .moon-number {
            font-family: 'Cinzel', serif;
            font-size: 5rem;
            font-weight: 800;
            color: #070B19;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.4);
            z-index: 2;
        }

        .side-star {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 2.2rem;
            color: var(--gold-glow);
            filter: drop-shadow(0 0 10px rgba(253, 224, 71, 0.8));
            animation: pulse 2s infinite ease-in-out;
            z-index: 3;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: var(--pastel-blue);
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--pastel-purple);
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .event-details {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            text-align: left;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .detail-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.8rem;
            font-size: 0.95rem;
        }

        .detail-item:last-child { margin-bottom: 0; }
        .detail-icon { font-size: 1.2rem; margin-right: 0.8rem; width: 24px; text-align: center; }

        .btn-maps {
            display: inline-block;
            margin-top: 0.5rem;
