<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trinay's 1st Birthday Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Sacramento&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #070B19;
      --bg-card: rgba(15, 23, 42, 0.75);
      --accent-gold: #F6D365;
      --accent-lavender: #D8B4FE;
      --accent-cyan: #38BDF8;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --border-glow: rgba(216, 180, 254, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    canvas#skyCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px 80px 16px;
      position: relative;
      z-index: 10;
    }

    /* Top Bar Settings & Audio Controls */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: var(--accent-gold);
    }

    /* Full Moon Hero Badge */
    .hero-badge {
      text-align: center;
      margin: 20px 0 30px 0;
      position: relative;
    }

    .moon-container {
      position: relative;
      width: 190px;
      height: 190px;
      margin: 0 auto 20px auto;
    }

    .full-moon {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #FFFDF0 0%, #FDF3C7 45%, #F59E0B 85%, #D97706 100%);
      box-shadow: 0 0 40px rgba(253, 224, 71, 0.5), 0 0 80px rgba(245, 158, 11, 0.3);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Crater Details */
    .crater {
      position: absolute;
      background: rgba(217, 119, 6, 0.15);
      border-radius: 50%;
    }
    .crater-1 { width: 35px; height: 35px; top: 20%; left: 20%; }
    .crater-2 { width: 22px; height: 22px; bottom: 25%; left: 30%; }
    .crater-3 { width: 40px; height: 40px; top: 50%; right: 15%; }

    /* Centered '1' */
    .moon-number {
      font-family: 'Cinzel', serif;
      font-size: 5.5rem;
      font-weight: 800;
      color: #070B19;
      text-shadow: 0 2px 4px rgba(255, 255, 255, 0.6);
      z-index: 2;
    }

    /* Attached Golden Star */
    .side-star {
      position: absolute;
      top: -5px;
      right: -5px;
      font-size: 2.8rem;
      filter: drop-shadow(0 0 12px #FDE047);
      animation: float 3s ease-in-out infinite;
      z-index: 3;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(12deg); }
    }

    .title-sub {
      font-family: 'Sacramento', cursive;
      font-size: 2.2rem;
      color: var(--accent-lavender);
    }

    .title-main {
      font-family: 'Cinzel', serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #FFF, var(--accent-gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: -5px;
    }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .card-title {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      color: var(--accent-gold);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .event-info {
      display: grid;
      gap: 14px;
      font-size: 0.95rem;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .info-icon {
      font-size: 1.3rem;
      width: 32px;
    }

    /* Countdown Timer */
    .timer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      text-align: center;
    }

    .timer-block {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 12px;
    }

    .timer-num {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .timer-lbl {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* RSVP Form */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--accent-lavender);
    }

    /* Attending Toggle */
    .rsvp-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .toggle-btn {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.2);
      color: #fff;
      cursor: pointer;
      text-align: center;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .toggle-btn.active-yes {
      background: rgba(34, 197, 94, 0.25);
      border-color: #22C55E;
      color: #4ADE80;
    }

    .toggle-btn.active-no {
      background: rgba(239, 68, 68, 0.25);
      border-color: #EF4444;
      color: #F87171;
    }

    /* Pax Counter */
    .pax-control {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .pax-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .pax-val {
      font-size: 1.2rem;
      font-weight: 700;
    }

    /* Buttons */
    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-gold), #F59E0B);
      color: #070B19;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3);
      margin-top: 10px;
    }

    .btn-map {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      text-decoration: none;
      font-weight: 600;
      margin-top: 10px;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: #0F172A;
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>

  <canvas id="skyCanvas"></canvas>

  <div class="container">
    
    <!-- Top Action Bar -->
    <div class="top-bar">
      <button class="icon-btn" onclick="toggleAudio()">
        <span id="audioIcon">🎵</span> <span id="audioText">Play Lullaby</span>
      </button>
      <button class="icon-btn" onclick="openSettings()">
        ⚙️ Settings
      </button>
    </div>

    <!-- Hero Full Moon Header -->
    <div class="hero-badge">
      <div class="moon-container">
        <div class="full-moon">
          <div class="crater crater-1"></div>
          <div class="crater crater-2"></div>
          <div class="crater crater-3"></div>
          <span class="moon-number">1</span>
        </div>
        <div class="side-star">⭐</div>
      </div>
      <div class="title-sub">You're invited to celebrate</div>
      <div class="title-main">Trinay's 1st Birthday</div>
    </div>

    <!-- Event Details Card -->
    <div class="card">
      <div class="card-title">📅 Date & Venue</div>
      <div class="event-info">
        <div class="info-row">
          <span class="info-icon">🗓️</span>
          <div>
            <strong>Sunday, 11 October 2026</strong>
          </div>
        </div>
        <div class="info-row">
          <span class="info-icon">🕕</span>
          <div>
            <strong>6:00 PM onwards</strong>
          </div>
        </div>
        <div class="info-row">
          <span class="info-icon">📍</span>
          <div>
            <strong>Eden Park</strong><br>
            <span style="color: var(--text-muted); font-size: 0.85rem;">Cunningham Road, Bengaluru</span>
          </div>
        </div>
      </div>

      <a href="https://maps.google.com/?q=Eden+Park+Cunningham+Road+Bengaluru" target="_blank" class="btn-map">
        📍 Open in Google Maps
      </a>
    </div>

    <!-- Countdown Timer Card -->
    <div class="card">
      <div class="card-title">⏳ Countdown to the Party</div>
      <div class="timer-grid">
        <div class="timer-block">
          <div class="timer-num" id="d">00</div>
          <div class="timer-lbl">Days</div>
        </div>
        <div class="timer-block">
          <div class="timer-num" id="h">00</div>
          <div class="timer-lbl">Hours</div>
        </div>
        <div class="timer-block">
          <div class="timer-num" id="m">00</div>
          <div class="timer-lbl">Mins</div>
        </div>
        <div class="timer-block">
          <div class="timer-num" id="s">00</div>
          <div class="timer-lbl">Secs</div>
        </div>
      </div>
    </div>

    <!-- RSVP Form Card -->
    <div class="card">
      <div class="card-title">💌 RSVP Response</div>
      
      <form id="rsvpForm" onsubmit="submitRSVP(event)">
        <div class="form-group">
          <label>Your Name *</label>
          <input type="text" id="guestName" placeholder="Enter full name" required>
        </div>

        <div class="form-group">
          <label>Will you join us?</label>
          <div class="rsvp-toggle">
            <button type="button" class="toggle-btn active-yes" id="btnYes" onclick="setAttending(true)">Yes, I'll be there!</button>
            <button type="button" class="toggle-btn" id="btnNo" onclick="setAttending(false)">Regretfully No</button>
          </div>
        </div>

        <div class="form-group" id="paxGroup">
          <label>Number of Pax (Guests)</label>
          <div class="pax-control">
            <button type="button" class="pax-btn" onclick="adjustPax(-1)">-</button>
            <span class="pax-val" id="paxCount">1</span>
            <button type="button" class="pax-btn" onclick="adjustPax(1)">+</button>
          </div>
        </div>

        <div class="form-group">
          <label>Message / Notes (Optional)</label>
          <textarea id="notes" rows="2" placeholder="Wishes or dietary preferences..."></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Submit RSVP</button>
      </form>
    </div>

  </div>

  <!-- Settings Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3 style="color: var(--accent-gold); margin-bottom: 12px;">⚙️ Host Configuration</h3>
      <div class="form-group">
        <label>Google Apps Script Web App URL</label>
        <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
      <div class="form-group">
        <label>Host Phone Number (WhatsApp fallback)</label>
        <input type="text" id="hostPhone" placeholder="e.g. 919876543210">
      </div>
      <button class="btn-submit" onclick="saveSettings()">Save Configuration</button>
    </div>
  </div>

  <script>
    // Starry Background Canvas Animation
    const canvas = document.getElementById('skyCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initStars();
    }

    function initStars() {
      stars = [];
      const count = Math.floor((canvas.width * canvas.height) / 3000);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.5,
          alpha: Math.random(),
          speed: 0.005 + Math.random() * 0.015
