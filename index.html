<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trinay's 1st Birthday Celebration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Nunito:wght@400;600;700&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0e1a;
            --navy-deep: #121829;
            --pastel-purple: #d8b4fe;
            --pastel-blue: #93c5fd;
            --pastel-pink: #f472b6;
            --gold-accent: #fde68a;
            --text-light: #f8fafc;
            --card-bg: rgba(18, 24, 41, 0.75);
            --border-glow: rgba(192, 132, 252, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Nunito', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 16px 60px 16px;
            position: relative;
            z-index: 10;
        }

        .top-nav {
            display: flex;
            justify-content: flex-end;
            padding: 10px 0;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-glow);
            color: var(--text-light);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .icon-btn:hover {
            background: rgba(192, 132, 252, 0.25);
            transform: scale(1.05);
        }

        .icon-btn.playing {
            background: rgba(192, 132, 252, 0.4);
            border-color: var(--gold-accent);
            box-shadow: 0 0 12px rgba(252, 211, 77, 0.6);
            animation: pulse-audio 1s infinite alternate ease-in-out;
        }

        @keyframes pulse-audio {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .hero-section {
            text-align: center;
            margin: 20px 0 35px 0;
        }

        .moon-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 25px auto;
        }

        .full-moon {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f1f5f9 45%, #cbd5e1 80%, #94a3b8 100%);
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.8), 0 0 70px rgba(192, 132, 252, 0.4), inset -10px -10px 20px rgba(148, 163, 184, 0.5);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .moon-crater {
            position: absolute;
            background: rgba(148, 163, 184, 0.25);
            border-radius: 50%;
            box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.15);
        }

        .crater-1 { width: 35px; height: 35px; top: 20%; left: 20%; }
        .crater-2 { width: 25px; height: 25px; bottom: 25%; left: 30%; }
        .crater-3 { width: 45px; height: 45px; top: 40%; right: 15%; }

        .moon-number {
            font-family: 'Cinzel', serif;
            font-size: 5rem;
            font-weight: 800;
            color: #0f172a;
            text-shadow: 0px 2px 6px rgba(255, 255, 255, 0.8);
            z-index: 2;
            line-height: 1;
        }

        .side-star {
            position: absolute;
            top: -5px;
            right: -10px;
            font-size: 2.8rem;
            color: var(--gold-accent);
            filter: drop-shadow(0 0 10px rgba(252, 211, 77, 0.8));
            animation: pulse-star 2s infinite alternate ease-in-out;
            z-index: 3;
        }

        @keyframes pulse-star {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.15) rotate(12deg); }
        }

        .invite-message {
            font-family: 'Sacramento', cursive;
            font-size: 2.4rem;
            color: var(--pastel-purple);
            margin-bottom: 2px;
            line-height: 1.2;
            text-shadow: 0 0 12px rgba(216, 180, 254, 0.3);
        }

        h1.title {
            font-family: 'Cinzel', serif;
            font-size: 2.1rem;
            font-weight: 700;
            color: var(--gold-accent);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(253, 230, 138, 0.3);
            margin-bottom: 8px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 25px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .info-icon {
            font-size: 1.5rem;
            background: rgba(192, 132, 252, 0.15);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .info-text label {
            display: block;
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-text span {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-light);
        }

        .countdown-title {
            text-align: center;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--pastel-purple);
            margin-bottom: 12px;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            text-align: center;
        }

        .timer-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 5px;
        }

        .timer-num {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--gold-accent);
        }

        .timer-unit {
            font-size: 0.65rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--pastel-blue);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s ease;
        }

        .form-input:focus {
            border-color: var(--pastel-purple);
            box-shadow: 0 0 10px rgba(192, 132, 252, 0.3);
        }

        .radio-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .radio-btn {
            position: relative;
        }

        .radio-btn input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .radio-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .radio-subtext {
            font-size: 0.75rem;
            font-weight: 400;
            opacity: 0.8;
            margin-top: 2px;
        }

        .radio-btn input:checked + .radio-label {
            background: rgba(192, 132, 252, 0.25);
            border-color: var(--pastel-purple);
            color: #fff;
            box-shadow: 0 0 12px rgba(192, 132, 252, 0.4);
        }

        .pax-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 6px;
            transition: opacity 0.3s ease;
        }

        .pax-control.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .pax-btn {
            width: 40px;
            height: 40px;
            background: rgba(192, 132, 252, 0.2);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .pax-btn:hover {
            background: rgba(192, 132, 252, 0.4);
        }

        .pax-count {
            font-size: 1.2rem;
            font-weight: 700;
            width: 60px;
            text-align: center;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--pastel-purple), #8b5cf6);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2deg);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
        }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .status-msg {
            display: none;
            padding: 12px;
            border-radius: 10px;
            margin-top: 12px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .status-msg.success {
            display: block;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.5);
            color: #4ade80;
        }

        .status-msg.error {
            display: block;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #f87171;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <div class="top-nav">
            <button class="icon-btn" id="audio-toggle" title="Play Twinkle Twinkle Melody" aria-label="Toggle Melody">🎵</button>
        </div>

        <div class="hero-section">
            <div class="moon-container">
                <div class="full-moon">
                    <div class="moon-crater crater-1"></div>
                    <div class="moon-crater crater-2"></div>
                    <div class="moon-crater crater-3"></div>
                    <div class="moon-number">1</div>
                </div>
                <div class="side-star">⭐</div>
            </div>
            <p class="invite-message">You're invited to celebrate</p>
            <h1 class="title">TRINAY'S 1ST BIRTHDAY</h1>
        </div>

        <div class="card">
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-icon">📅</div>
                    <div class="info-text">
                        <label>Date</label>
                        <span>Sunday, 11 Oct</span>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-icon">🕕</div>
                    <div class="info-text">
                        <label>Time</label>
                        <span>6:00 PM Onwards</span>
                    </div>
                </div>
            </div>

            <div class="info-item" style="margin-bottom: 20px;">
                <div class="info-icon">📍</div>
                <div class="info-text">
                    <label>Venue</label>
                    <span>Eden Park, Cunningham Road</span>
                </div>
            </div>

            <a href="https://maps.google.com/?q=Eden+Park+Cunningham+Road" target="_blank" rel="noopener noreferrer" class="btn-secondary">
                🗺️ Open in Google Maps
            </a>
        </div>

        <div class="card">
            <div class="countdown-title">Countdown to Celebration</div>
            <div class="timer-grid">
                <div class="timer-box">
                    <div class="timer-num" id="days">00</div>
                    <div class="timer-unit">Days</div>
                </div>
                <div class="timer-box">
                    <div class="timer-num" id="hours">00</div>
                    <div class="timer-unit">Hours</div>
                </div>
                <div class="timer-box">
                    <div class="timer-num" id="minutes">00</div>
                    <div class="timer-unit">Mins</div>
                </div>
                <div class="timer-box">
                    <div class="timer-num" id="seconds">00</div>
                    <div class="timer-unit">Secs</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 style="font-family: 'Cinzel', serif; margin-bottom: 18px; font-size: 1.4rem; text-align: center; color: var(--pastel-purple);">
                RSVP Response
            </h2>
            <form id="rsvp-form">
                <div class="form-group">
                    <label for="guest-name">Guest Name</label>
                    <input type="text" id="guest-name" class="form-input" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label>Will you be attending?</label>
                    <div class="radio-group">
                        <div class="radio-btn">
                            <input type="radio" id="rsvp-yes" name="attending" value="Yes" checked>
                            <label for="rsvp-yes" class="radio-label">✨ Yes, Excited!</label>
                        </div>
                        <div class="radio-btn">
                            <input type="radio" id="rsvp-no" name="attending" value="No">
                            <label for="rsvp-no" class="radio-label">
                                <span>🌙 Regretfully No</span>
                                <span class="radio-subtext">Send Wishes</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="form-group" id="pax-group">
                    <label>Number of Guests (Pax)</label>
                    <div class="pax-control" id="pax-control">
                        <button type="button" class="pax-btn" id="pax-minus" aria-label="Decrease guest count">−</button>
                        <span class="pax-count" id="pax-val">1</span>
                        <button type="button" class="pax-btn" id="pax-plus" aria-label="Increase guest count">+</button>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="submit-btn">
                    💌 Submit RSVP
                </button>

                <div id="status-msg" class="status-msg"></div>
            </form>
        </div>
    </div>

    <script>
        const CONFIG = {
            TARGET_DATE: new Date("October 11, 2026 18:00:00").getTime(),
            GOOGLE_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycby4lHQJH5Ym_UqcPU60iKN6f9u9P5_dyeRl20ayTJmaO2PMY_9SAvGNSjFnH8K1KTcr/exec'
        };

        // --- Canvas Animation (Stars + Shooting Stars) ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let shootingStars = [];
        let dpr = window.devicePixelRatio || 1;

        function resizeCanvas() {
            dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }

        function initStars() {
            stars = [];
            const count = Math.floor((window.innerWidth * window.innerHeight) / 3000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    radius: Math.random() * 1.5 + 0.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.02 + 0.005
                });
            }
        }

        function spawnShootingStar() {
            if (shootingStars.length < 3 && Math.random() < 0.03) {
                shootingStars.push({
                    x: Math.random() * window.innerWidth * 0.8,
                    y: Math.random() * (window.innerHeight * 0.4),
                    length: Math.random() * 80 + 50,
                    speed: Math.random() * 8 + 6,
                    angle: Math.PI / 4,
                    opacity: 1,
                    decay: Math.random() * 0.015 + 0.01
                });
            }
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

            // Draw twinkling background stars
            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;

                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
                ctx.fill();
            });

            // Handle shooting stars
            spawnShootingStar();
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const ss = shootingStars[i];
                const tailX = ss.x - Math.cos(ss.angle) * ss.length;
                const tailY = ss.y - Math.sin(ss.angle) * ss.length;

                const gradient = ctx.createLinearGradient(ss.x, ss.y, tailX, tailY);
                gradient.addColorStop(0, `rgba(255, 255, 255, ${ss.opacity})`);
                gradient.addColorStop(0.3, `rgba(216, 180, 254, ${ss.opacity * 0.8})`);
                gradient.addColorStop(1, `rgba(255, 255, 255, 0)`);

                ctx.beginPath();
                ctx.moveTo(ss.x, ss.y);
                ctx.lineTo(tailX, tailY);
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2;
                ctx.stroke();

                ss.x += Math.cos(ss.angle) * ss.speed;
                ss.y += Math.sin(ss.angle) * ss.speed;
                ss.opacity -= ss.decay;

                if (ss.opacity <= 0 || ss.x > window.innerWidth || ss.y > window.innerHeight) {
                    shootingStars.splice(i, 1);
                }
            }

            requestAnimationFrame(drawCanvas);
        }

        window.addEventListener('resize', () => { resizeCanvas(); initStars(); });
        resizeCanvas();
        initStars();
        drawCanvas();

        // --- Countdown Timer ---
        function updateCountdown() {
            const distance = CONFIG.TARGET_DATE - Date.now();
            if (distance < 0) {
                document.getElementById('days').innerText = "00";
                document.getElementById('hours').innerText = "00";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // --- Pax Count Logic ---
        let paxCount = 1;
        const paxVal = document.getElementById('pax-val');
        const paxControl = document.getElementById('pax-control');
        const rsvpYes = document.getElementById('rsvp-yes');
        const rsvpNo = document.getElementById('rsvp-no');

        document.getElementById('pax-minus').addEventListener('click', () => {
            if (paxCount > 1) { paxCount--; paxVal.innerText = paxCount; }
        });
        document.getElementById('pax-plus').addEventListener('click', () => {
            if (paxCount < 10) { paxCount++; paxVal.innerText = paxCount; }
        });

        function togglePaxUI() {
            if (rsvpNo.checked) {
                paxControl.classList.add('disabled');
                paxVal.innerText = '0';
            } else {
                paxControl.classList.remove('disabled');
                paxVal.innerText = paxCount;
            }
        }

        rsvpYes.addEventListener('change', togglePaxUI);
        rsvpNo.addEventListener('change', togglePaxUI);

        // --- RSVP Submission ---
        const rsvpForm = document.getElementById('rsvp-form');
        const statusMsg = document.getElementById('status-msg');
        const submitBtn = document.getElementById('submit-btn');

        rsvpForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('guest-name').value.trim();
            const attending = document.querySelector('input[name="attending"]:checked').value;
            const finalPax = attending === 'No' ? 0 : paxCount;

            const payload = { name, attending, pax: finalPax };

            submitBtn.disabled = true;
            submitBtn.innerText = 'Submitting...';
            statusMsg.className = 'status-msg';
            statusMsg.innerText = '';

            try {
                await fetch(CONFIG.GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                statusMsg.className = 'status-msg success';
                statusMsg.innerText = '✨ Thank you! Your RSVP has been submitted.';
                rsvpForm.reset();
                paxCount = 1;
                togglePaxUI();
            } catch (err) {
                statusMsg.className = 'status-msg error';
                statusMsg.innerText = '❌ Failed to submit RSVP. Please try again.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = '💌 Submit RSVP';
            }
        });

        // --- Audio Synthesizer ---
        let audioCtx = null;
        let isPlaying = false;
        let audioTimeout = null;

        const melody = [
            { note: 261.63, duration: 0.4 }, { note: 261.63, duration: 0.4 },
            { note: 392.00, duration: 0.4 }, { note: 392.00, duration: 0.4 },
            { note: 440.00, duration: 0.4 }, { note: 440.00, duration: 0.4 },
            { note: 392.00, duration: 0.8 },
            { note: 349.23, duration: 0.4 }, { note: 349.23, duration: 0.4 },
            { note: 329.63, duration: 0.4 }, { note: 329.63, duration: 0.4 },
            { note: 293.66, duration: 0.4 }, { note: 293.66, duration: 0.4 },
            { note: 261.63, duration: 0.8 }
        ];

        const audioBtn = document.getElementById('audio-toggle');

        function stopMelody() {
            if (audioCtx) {
                audioCtx.close();
                audioCtx = null;
            }
            if (audioTimeout) clearTimeout(audioTimeout);
            isPlaying = false;
            audioBtn.classList.remove('playing');
            audioBtn.innerText = '🎵';
        }

        function playMelody() {
            if (isPlaying) {
                stopMelody();
                return;
            }

            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            isPlaying = true;
            audioBtn.classList.add('playing');
            audioBtn.innerText = '🔊';

            let time = audioCtx.currentTime;
            const totalDuration = melody.reduce((acc, item) => acc + item.duration, 0);

            melody.forEach(item => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(item.note, time);

                gain.gain.setValueAtTime(0.01, time);
                gain.gain.linearRampToValueAtTime(0.15, time + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, time + item.duration - 0.05);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(time);
                osc.stop(time + item.duration);

                time += item.duration;
            });

            audioTimeout = setTimeout(stopMelody, totalDuration * 1000);
        }

        audioBtn.addEventListener('click', playMelody);
    </script>
</body>
</html>
